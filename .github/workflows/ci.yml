name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # ---------------------------------------------------------------------------
  # 前端：单元测试 + 构建
  # 任何一步失败（非 0 退出码）都会使整个 job 失败，从而阻断 PR 合并和 push。
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend · Unit Tests + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pinry-spa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        id: unit_tests
        run: pnpm test:unit

      - name: Build production bundle
        id: build
        run: NODE_OPTIONS=--openssl-legacy-provider pnpm build

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: pinry-spa/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 后端：单元测试（Django）
  # 同样使用 SQLite 内存库跑批量操作等测试用例
  # ---------------------------------------------------------------------------
  backend:
    name: Backend · Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies (Pillow)
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg62-turbo-dev zlib1g-dev libtiff5-dev libopenjp2-7

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mock setuptools

      - name: Run backend unit tests (core batch operations)
        env:
          DJANGO_SETTINGS_MODULE: pinry.settings.test
        run: |
          python manage.py test core.tests.batch_operations --verbosity=2
